
<div class="dashboard">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">VA</div>
      <div>
        <h2>Valle Académico</h2>
        <span>Panel de gestión</span>
      </div>
    </div>

    <div class="menu-label">MENÚ PRINCIPAL</div>

    <nav class="menu">

      <a routerLink="/inicio"
         routerLinkActive="activo"
         [routerLinkActiveOptions]="{ exact: true }">
        <span class="menu-icon">⌂</span>
        Inicio
      </a>

      <a routerLink="/estudiantes"
         routerLinkActive="activo">
        <span class="menu-icon">♙</span>
        Estudiantes
      </a>

      <a routerLink="/cursos"
         routerLinkActive="activo">
        <span class="menu-icon">▤</span>
        Cursos
      </a>

      <a routerLink="/perfil"
         routerLinkActive="activo">
        <span class="menu-icon">◎</span>
        Mi perfil
      </a>

    </nav>

    <div class="sidebar-footer">
      <span class="estado"></span>
      Sistema académico
      <small>Versión demostrativa</small>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <span class="topbar-label">PLATAFORMA ACADÉMICA</span>
        <h2>Panel de administración</h2>
      </div>

      <div class="usuario">
        <div class="avatar">VG</div>
        <div>
          <strong>Administrador</strong>
          <small>Usuario del sistema</small>
        </div>
      </div>
    </header>

    <section class="contenido">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
